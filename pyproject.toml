[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "leadpilot"
version = "0.2.0"
description = "Autonomous Lead Discovery, Enrichment & ICP Scoring Pipeline"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "LeadPilot AI Team" }
]
keywords = [
    "lead-generation",
    "lead-enrichment",
    "icp-scoring",
    "langgraph",
    "pydantic",
    "osint",
    "b2b-sales"
]
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "langgraph>=0.2.0",
    "beautifulsoup4>=4.12.0",
    "extruct>=0.16.0",
    "dnspython>=2.6.0",
    "openpyxl>=3.1.0",
    "pandas>=2.0.0",
    "streamlit>=1.35.0",
    "thefuzz>=0.22.1",
    "python-dotenv>=1.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.4.0",
    "black>=24.0.0"
]

[project.scripts]
leadpilot = "main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
